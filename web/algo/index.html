<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アルゴ劇場</title>
<link rel="icon" href="../app/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="algo.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- icônes maison : trait encre arrondi + remplissage pastel (var(--f)) -->
  <symbol id="i-oeil" viewBox="0 0 24 24"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" fill="var(--f, #fde3ec)"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="13.2" cy="10.8" r="1" fill="#fff" stroke="none"/></symbol>
  <symbol id="i-pense" viewBox="0 0 24 24"><path d="M7.5 15.5a4 4 0 0 1-.3-8 5.2 5.2 0 0 1 9.9.8 3.6 3.6 0 0 1 .2 7.2z" fill="var(--f, #fff3c9)"/><circle cx="6" cy="19" r="1.4" fill="var(--f, #fff3c9)"/><circle cx="3.6" cy="21.6" r=".8"/><path d="M10.6 9.6a1.7 1.7 0 1 1 2.3 1.6c-.6.3-.8.6-.8 1.2"/><circle cx="12.1" cy="13.9" r=".5" fill="currentColor"/></symbol>
  <symbol id="i-de" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="var(--f, #e6f2fd)"/><g fill="currentColor" stroke="none"><circle cx="8.3" cy="8.3" r="1.5"/><circle cx="15.7" cy="8.3" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="8.3" cy="15.7" r="1.5"/><circle cx="15.7" cy="15.7" r="1.5"/></g></symbol>
  <symbol id="i-crayon" viewBox="0 0 24 24"><path d="M4.5 19.5l1-4.5L15.8 4.7a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L9 18.5z" fill="var(--f, #f9c6d6)"/><path d="M14 6.5l3.5 3.5M5.5 15l3.5 3.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.9l9.8-6.4a1 1 0 0 0 0-1.7L9.5 4.7A1 1 0 0 0 8 5.6z" fill="currentColor"/></symbol>
  <symbol id="i-prec" viewBox="0 0 24 24"><path d="M16 5.6v12.8a1 1 0 0 1-1.5.9L4.7 12.9a1 1 0 0 1 0-1.7l9.8-6.5a1 1 0 0 1 1.5.9z" fill="currentColor"/></symbol>
  <symbol id="i-debut" viewBox="0 0 24 24"><path d="M5 5v14"/><path d="M19 5.6v12.8a1 1 0 0 1-1.5.9L8.4 12.9a1 1 0 0 1 0-1.7l9.1-6.5a1 1 0 0 1 1.5.9z" fill="currentColor"/></symbol>
  <symbol id="i-encore" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4"/><path d="M4 3.5v4.4h4.4"/></symbol>
  <symbol id="i-croix" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-eclat" viewBox="0 0 24 24"><path d="M10 3c.6 4.6 2 6 6.5 6.5-4.5.6-5.9 2-6.5 6.5-.6-4.5-2-5.9-6.5-6.5C8 9 9.4 7.6 10 3z" fill="var(--f, #f5d36b)"/><path d="M18 14c.3 2 .9 2.6 3 3-2.1.3-2.7.9-3 3-.3-2.1-.9-2.7-3-3 2.1-.4 2.7-1 3-3z" fill="var(--f, #f5d36b)"/></symbol>
  <symbol id="i-coeur" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z" fill="var(--f, #f9a8c0)"/><path d="M8 9.5a1.8 1.8 0 0 1 1.6-1.4" stroke="#fff"/></symbol>
  <symbol id="i-etoile" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="var(--f, #f5d36b)"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="3" fill="var(--f, #fffaf0)"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></symbol>
  <symbol id="i-noeud" viewBox="0 0 24 24"><path d="M12 12L4.5 7.5c-1.2-.7-2 .3-2 1.3v6.4c0 1 .8 2 2 1.3zM12 12l7.5-4.5c1.2-.7 2 .3 2 1.3v6.4c0 1-.8 2-2 1.3z" fill="var(--f, #f9a8c0)"/><circle cx="12" cy="12" r="2.3" fill="var(--f, #f9a8c0)"/><path d="M10.6 14l-1.8 5M13.4 14l1.8 5"/></symbol>
  <symbol id="i-fleur" viewBox="0 0 24 24"><g fill="var(--f, #fbd0dd)"><circle cx="12" cy="6.5" r="3.3"/><circle cx="17.2" cy="10.3" r="3.3"/><circle cx="15.2" cy="16.4" r="3.3"/><circle cx="8.8" cy="16.4" r="3.3"/><circle cx="6.8" cy="10.3" r="3.3"/></g><circle cx="12" cy="12" r="2.2" fill="#f5d36b"/></symbol>
  <symbol id="i-couronne" viewBox="0 0 24 24"><path d="M3.5 17.5L5 8l4.5 4L12 5.5l2.5 6.5L19 8l1.5 9.5z" fill="var(--f, #f5d36b)"/><path d="M4 20h16"/></symbol>
  <symbol id="i-fete" viewBox="0 0 24 24"><path d="M4 20l4.5-12 7.5 7.5z" fill="var(--f, #c9b2ef)"/><path d="M14 4.5c.5 1.5 0 2.5-1 3M19.5 10c-1.5-.5-2.5 0-3 1M17 3.5v.1M20.5 6.5v.1M11 3v.1"/></symbol>
  <symbol id="i-doigt" viewBox="0 0 24 24"><path d="M7 3.5l11.5 8-5.2 1.3 3.3 5.6-2.3 1.3-3.3-5.6L7 17.5z" fill="var(--f, #fffaf0)"/></symbol>
  <symbol id="i-tasse" viewBox="0 0 24 24"><path d="M4.5 9.5h12v4.5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z" fill="var(--f, #f3dfc4)"/><path d="M16.5 11h1.3a2.3 2.3 0 0 1 0 4.6h-1.6M8.5 3.5c-.8 1 .8 2-.1 3M12.5 3.5c-.8 1 .8 2-.1 3"/></symbol>
  <symbol id="i-eclair" viewBox="0 0 24 24"><path d="M13.5 2.5L5 13.5h6l-1 8 8.5-11h-6z" fill="var(--f, #f5d36b)"/></symbol>
</svg>
<canvas id="confettis" aria-hidden="true"></canvas>
<div class="ecran">

  <header class="haut">
    <a class="retour" href="../" data-t-title="retour">←</a>
    <h1 class="jp">アルゴ劇場</h1>
    <nav id="choix" class="chips"></nav>
    <div class="outils">
      <div class="modes" id="modes">
        <button data-mode="voir" class="mode" data-t="voir"></button>
        <button data-mode="deviner" class="mode" data-t="deviner"></button>
      </div>
      <button class="petit" id="ouvrir-donnees" data-t="donnees"></button>
      <button class="petit plein" id="ouvrir-exos" data-t="exos"></button>
      <div class="modes langues" id="langues" aria-label="Language">
        <button data-lang="ja" class="mode">日本語</button>
        <button data-lang="en" class="mode">EN</button>
      </div>
    </div>
  </header>

  <p id="intro" class="intro"></p>

  <main class="scene">
    <section class="carte code-carte">
      <div class="titre-carte" data-t="t-code"></div>
      <ol id="code" class="code"></ol>
    </section>

    <div class="milieu">
      <section class="carte prof">
        <svg class="loutre" id="loutre" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="24" cy="30" r="9" class="l-poil"/><circle cx="24" cy="30" r="4.5" class="l-creme"/>
          <circle cx="76" cy="30" r="9" class="l-poil"/><circle cx="76" cy="30" r="4.5" class="l-creme"/>
          <circle cx="50" cy="56" r="35" class="l-poil"/>
          <ellipse cx="50" cy="68" rx="21" ry="15" class="l-creme"/>
          <circle cx="29" cy="64" r="5.5" class="l-joue"/><circle cx="71" cy="64" r="5.5" class="l-joue"/>
          <g class="l-yeux">
            <circle cx="38" cy="52" r="4.6" class="l-noir"/><circle cx="62" cy="52" r="4.6" class="l-noir"/>
            <circle cx="39.6" cy="50.4" r="1.5" fill="#fff"/><circle cx="63.6" cy="50.4" r="1.5" fill="#fff"/>
          </g>
          <ellipse cx="50" cy="61" rx="5.5" ry="3.8" class="l-noir"/>
          <path d="M44 68 Q50 73 56 68" class="l-trait"/>
          <path d="M33 66 L18 63 M33 69 L19 71 M67 66 L82 63 M67 69 L81 71" class="l-trait fin"/>
        </svg>
        <div id="bulle" class="bulle" aria-live="polite"></div>
      </section>

      <section class="carte">
        <div class="titre-carte" data-t="t-vars"></div>
        <div id="vars" class="vars"></div>
      </section>

      <section class="carte stage-carte">
        <div class="titre-carte"><span data-t="t-arr"></span><span id="cible" class="cible"></span></div>
        <div id="stage" class="stage"></div>
      </section>
    </div>

    <div class="cote">
      <section class="carte trace-carte">
        <div class="titre-carte" data-t="t-trace"></div>
        <div id="trace" class="trace-boite"></div>
      </section>
      <section class="carte">
        <div class="titre-carte" data-t="t-cpt"></div>
        <div id="compteurs" class="compteurs"></div>
      </section>
    </div>
  </main>

  <footer class="commandes" role="toolbar">
    <button id="b-debut" class="rond" data-t-title="debut"><svg class="ico"><use href="#i-debut"/></svg></button>
    <button id="b-arriere" class="rond" data-t-title="arriere"><svg class="ico"><use href="#i-prec"/></svg></button>
    <button id="b-avant" class="suivant"></button>
    <div class="avance">
      <div class="barre-prog"><i id="prog"></i></div>
      <span id="etape" class="etape"></span>
    </div>
    <span class="aide muted" data-t="aide"></span>
  </footer>
</div>

<dialog id="d-donnees" class="fenetre">
  <div class="fenetre-haut"><b data-t="donnees"></b><button class="fermer" data-fermer><svg class="ico"><use href="#i-croix"/></svg></button></div>
  <div id="donnees"></div>
</dialog>

<dialog id="d-exos" class="fenetre panneau">
  <div class="fenetre-haut">
    <div class="onglets" id="onglets">
      <button data-onglet="blancs" data-t="o-blancs"></button>
      <button data-onglet="qcm" data-t="o-qcm"></button>
    </div>
    <button class="fermer" data-fermer><svg class="ico"><use href="#i-croix"/></svg></button>
  </div>
  <div id="exos-donnees" class="exos-donnees"></div>
  <div id="o-blancs" class="onglet"></div>
  <div id="o-qcm" class="onglet"></div>
</dialog>

<script src="algos.js"></script>
<script src="fete.js"></script>
<script src="moteur.js"></script>
</body>
</html>
